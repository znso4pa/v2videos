[package]
name = "v2v-android"
description = "Android 硬件编码路径（MediaCodec H.264 + MediaMuxer MP4）—— unsafe / FFI 集中在这里"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
publish = false

# `cdylib` 是给宿主 App 用的：`libv2v_android.so` 导出 `src/capi.rs` 里那几个
# C ABI 函数，JNI 桥 dlopen 它就行。`rlib` 保持不变，测试与 CLI 照旧。
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
v2v-player = { path = "../player" }
v2v-aac = { path = "../aac" }
v2v-mp4 = { path = "../mp4" }
v2v-asf = { path = "../asf" }
v2v-vc1 = { path = "../vc1" }
v2v-wma = { path = "../wma" }

[build-dependencies]
cc = "1"
