[package]
name = "v2v-mp4"
description = "纯 Rust MP4 / ISOBMFF 封装 —— 无 C、无 FFI"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
# 解封装要吐 `Stream` / `Sample` —— 那是全仓共用的数据模型。
v2v-container = { path = "../v2v-container" }

[dev-dependencies]
# `tests/mux_bench.rs` 用它的 TSV 格式（`V2V_BENCH_TSV` 给了路径才写）。
v2v-bench = { path = "../v2v-bench" }
