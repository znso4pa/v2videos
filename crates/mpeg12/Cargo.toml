[package]
name = "v2v-mpeg12"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MPEG-1/2 video elementary stream parser"

[dependencies]
# 码表（LGPL 派生数据）单独一个 crate —— 见 crates/tables/src/lib.rs
v2v-tables = { path = "../tables" }
# 位读取器 / IDCT / FDCT —— 与具体编解码格式无关的那几件，走共享内核。
v2v-kernel = { path = "../v2v-kernel" }

[dev-dependencies]
# 测试与 example 要从 MPEG-PS 里取样本；`src/` 本身不碰容器层。
v2v-mpegps = { path = "../v2v-mpegps" }
