[package]
name = "v2v-cli"
description = "v2video 的命令行工具：WMV/ASF 批量转码（解封装 → 解码 → 编码 → 封装）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "v2v"
path = "src/main.rs"

[dependencies]
# 只用它的 `Error`（全仓编解码器共用那一个），`Error::Codec` 收的就是它。
v2v-kernel = { path = "../kernel" }
v2v-asf = { path = "../asf" }
v2v-avi = { path = "../avi" }
v2v-container = { path = "../container" }
v2v-msmpeg4 = { path = "../msmpeg4" }
# VC-1（WMV3）输入：只有解码器，输出仍走 MP43 / mp4v。
v2v-vc1 = { path = "../vc1" }
# MP4 那条路：容器 + MPEG-4 Part 2 编码器 + WMA 解码 →（AAC 编码 / PCM）。
v2v-mp4 = { path = "../mp4" }
v2v-mp4v = { path = "../mp4v" }
v2v-aac = { path = "../aac" }
v2v-wma = { path = "../wma" }
# `v2v bench` 的测量对象。⚠️ 这两个**只服务 bench**，`convert` 那条路不用它们：
#   - `v2v-player` 把「解封装 + 解码」接成一个能逐帧取数的循环，bench 量的就是它，
#     自己再写一遍就等于同一件事有两个说法；
#   - `mpeg12` feature 让 `.mpg` 也能进同一个入口（`convert` 不处理 MPEG-PS）。
v2v-player = { path = "../player", features = ["mpeg12"] }
# 测量结果的格式 / 机器指纹 / 回归比较。**零依赖**，不拖任何编解码器。
v2v-bench = { path = "../bench" }
