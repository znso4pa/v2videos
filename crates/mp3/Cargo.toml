[package]
name = "v2v-mp3"
description = "MPEG Audio Layer III 分帧与纯 Rust 解码"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["decode"]
decode = ["dep:v2v-tables"]

[dependencies]
v2v-kernel = { path = "../v2v-kernel" }
v2v-tables = { path = "../tables", default-features = false, features = ["mp3"], optional = true }
