[package]
name = "v2v-mp4v"
description = "纯 Rust 的 MPEG-4 Part 2（mp4v）视频编码 —— I/P 帧 + 码率控制，无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# DCT / 位写入器 / 前缀码 / RL 表 / IDCT 这几件「与具体编码格式无关」的东西，
# 直接复用共享内核 —— 不复刻一遍（复刻出来的第二份才是真会跑偏的那份）。
v2v-kernel = { path = "../kernel" }
# `Frame` / `Planes` / `mc_*` / `mid_pred` / `ZIGZAG` 目前还在 msmpeg4 里，
# 等下一步搬进 kernel（见 TODO）。搬完这一行就能删。
v2v-msmpeg4 = { path = "../msmpeg4" }

[dev-dependencies]
# 对账测试要把编出来的流封成 MP4 再让 ffmpeg 解，所以容器也要能用。
v2v-mp4 = { path = "../mp4" }
