[package]
name = "v2v-mp4v"
description = "纯 Rust 的 MPEG-4 Part 2（mp4v）视频编码 —— I/P 帧 + 码率控制，无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 码表（LGPL 派生数据）单独一个 crate —— 见 crates/tables/src/lib.rs
v2v-tables = { path = "../tables", default-features = false, features = ["mp4v"] }
# DCT / 位写入器 / 前缀码 / RL 表 / IDCT / 帧缓冲 / 运动补偿 / AC 预测 / DC 反量化，
# 全在共享内核里 —— 直接复用，不复刻一遍（复刻出来的第二份才是真会跑偏的那份）。
#
# ⚠️ 这里**没有** `v2v-msmpeg4`：MPEG-4 Part 2 与 MS-MPEG-4 只在「数值内核」这一层
# 相通，语法层各写各的。哪天想从这边借 MS-MPEG-4 的东西，先想清楚它是不是该进 kernel。
v2v-kernel = { path = "../v2v-kernel" }

[dev-dependencies]
# 对账测试要把编出来的流封成 MP4 再让 ffmpeg 解，所以容器也要能用。
v2v-mp4 = { path = "../v2v-mp4" }
