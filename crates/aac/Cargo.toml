[package]
name = "v2v-aac"
description = "纯 Rust 的 AAC-LC 音频编码 —— 无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 码表（LGPL 派生数据）单独一个 crate —— 见 crates/tables/src/lib.rs
v2v-tables = { path = "../tables", default-features = false, features = ["aac"] }
# MDCT 的 FFT 与位写入器（`BitWriter` 的 MSB 优先语义正好与 AAC 一致）——
# 都是与具体编码格式无关的东西，复用共享内核里已经验证过的那一份。
v2v-kernel = { path = "../v2v-kernel" }
