[package]
name = "v2v-player"
description = "顺时播放：解封装 + 解码接成一个能逐帧 / 逐样本取数的播放器"
version.workspace = true
edition.workspace = true
license = "MIT"

[features]
default = []
# MPEG-1/2（`.mpg` / `.dat` 的 program stream），**只有视频**（MP2 音频本仓没有解码器）。
# **非默认**：只吃 WMV 的宿主打 `.so` 时不该背上这套码表 —— 这是「最小体积」的开关。
mpeg12 = ["dep:v2v-mpeg12", "dep:v2v-mpegps"]
mpeg12-c = ["mpeg12", "dep:v2v-mpeg12-c"]
# 切片级并行改用**常驻线程池**（`v2v-mpeg12-simd` 的 `pool`）。
#
# ⚠️ **这个 feature 会引入 `unsafe`** —— 常驻 worker 要跨帧拿着 `&mut Frame`
# 和码流，`std::thread::scope` 做不到（借用绑在作用域上），只能降级成裸指针。
# 所以它**默认关**：关着的时候整条依赖闭包仍然零 `unsafe`（`v2v-mpeg12` 的
# 文档承诺因此不变，它照样是 oracle）。
#
# 实测（M3、720×576 500 帧、仅解码、已扣掉解封装）：2 线程快 4.7%、
# 4 线程快 **11.3%**、8 线程快 **14.9%** —— 省的就是每帧一次 `spawn`/`join`
# （4 线程 40.7 µs/帧）。产物与 `MtDecoder` **逐字节相同**
# （`crates/v2v-mpeg12-simd/tests/pool.rs` 三条判据钉着）。
mpeg12-pool = ["mpeg12", "dep:v2v-mpeg12-simd"]

[dependencies]
# 只用它的 `Error`（全仓编解码器共用那一个），在 `From` 里换成播放器自己的错误。
v2v-kernel = { path = "../v2v-kernel" }
# 容器无关的共用类型（流 / 样本 / 格式）。
v2v-container = { path = "../v2v-container" }
v2v-asf = { path = "../v2v-asf" }
v2v-vc1 = { path = "../vc1" }
v2v-wma = { path = "../wma" }
v2v-mpeg12 = { path = "../mpeg12", optional = true }
v2v-mpegps = { path = "../v2v-mpegps", optional = true }
v2v-mpeg12-c = { path = "../v2v-mpeg12-c", optional = true, features = ["neon"] }
# 常驻线程池（唯一带 `unsafe` 的并行实现），见 `mpeg12-pool` feature。
v2v-mpeg12-simd = { path = "../v2v-mpeg12-simd", optional = true }
