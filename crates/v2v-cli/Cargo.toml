[package]
name = "v2v-cli"
description = "v2video 的命令行工具：WMV/ASF 批量转码（解封装 → 解码 → 编码 → 封装）"
version.workspace = true
edition.workspace = true
license = "MIT"

[[bin]]
name = "v2v"
path = "src/main.rs"

[features]
mp3-ffi = ["dep:v2v-audio-ffi"]
mpeg12-c = ["v2v-player/mpeg12-c"]

[dependencies]
# 只用它的 `Error`（全仓编解码器共用那一个），`Error::Codec` 收的就是它。
v2v-kernel = { path = "../v2v-kernel" }
v2v-asf = { path = "../v2v-asf" }
v2v-avi = { path = "../v2v-avi" }
# `.ogg` 输入：Ogg 容器层 + Vorbis 解码器（两者都只往下解，输出仍走 `.wmv` / `.mp4` / `.wav`）。
v2v-ogg = { path = "../v2v-ogg" }
v2v-vorbis = { path = "../v2v-vorbis" }
v2v-container = { path = "../v2v-container" }
v2v-msmpeg4 = { path = "../msmpeg4" }
# VC-1（WMV3）输入：只有解码器，输出仍走 MP43 / mp4v。
v2v-vc1 = { path = "../vc1" }
# MP4 那条路：容器 + MPEG-4 Part 2 编码器 + WMA 解码 →（AAC 编码 / PCM）。
v2v-mp4 = { path = "../v2v-mp4" }
v2v-mp4v = { path = "../mp4v" }
v2v-aac = { path = "../aac" }
v2v-wma = { path = "../wma" }
v2v-mp3 = { path = "../mp3" }
v2v-audio-ffi = { path = "../v2v-audio-ffi", optional = true, features = ["mpg123"] }
# `v2v bench` 的测量对象 + `.mpg` 输入的解码引擎。
#   - `v2v-player` 把「解封装 + 解码」接成一个能逐帧取数的循环，bench 量的就是它；
#   - `convert` 的 `.mpg` 那条路**不复用 `MpgPlayer`**，而是直接用下面两个 crate ——
#     它要的是「一个 picture 一个样本」，而 `MpgPlayer` 是整文件顺时播放。
#     出帧顺序那一套（`PictureDecoder`）两边是**同一份实现**，不各写一份。
v2v-player = { path = "../v2v-player", features = ["mpeg12"] }
v2v-mpeg12 = { path = "../mpeg12" }
v2v-mpegps = { path = "../v2v-mpegps" }
# `.mp4` 输入的 H.264 走**硬件解码**（只有 macOS 有）。别处编得动、运行时明确报不支持 ——
# 纯 Rust 的 H.264 解码器没有计划（见 README「还没做（解码侧）」）。
v2v-android = { path = "../v2v-android" }
# 测量结果的格式 / 机器指纹 / 回归比较。**零依赖**，不拖任何编解码器。
v2v-bench = { path = "../v2v-bench" }
