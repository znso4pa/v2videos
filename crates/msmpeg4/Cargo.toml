[package]
name = "v2v-msmpeg4"
description = "纯 Rust 的 Microsoft MPEG-4（MP41/MP42/MP43 / WMV1-2）视频解码 —— 无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 编解码器共用的那一层（位读写 / VLC / DCT / IDCT / FFT / SAD / NEON）。
# 本 crate 是它最大的用户：`simd` 那套 NEON 目前唯一的调用方就是这边的运动估计。
v2v-kernel = { path = "../kernel" }

[dev-dependencies]
# 只给 example / 集成测试用：从 ASF 里取视频样本做验证。
v2v-asf = { path = "../asf" }
# MP42 的对账样本只有 AVI 能装（ffmpeg 的 `msmpeg4v2` 编码器出 .avi）。
v2v-avi = { path = "../avi" }
