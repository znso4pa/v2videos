[package]
name = "v2v-msmpeg4"
description = "纯 Rust 的 Microsoft MPEG-4（MP41/MP42/MP43 / WMV1-2）视频解码 —— 无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 编解码器共用的那一层（位读写 / VLC / RL / DCT / IDCT / FFT / 帧缓冲 / 运动补偿 / SAD）。
# 本 crate 是它最大的用户：`simd` 那套 NEON 目前唯一的调用方就是这边的运动估计，
# 所以**只有这里**打开 `unsafe-kernels`（别的 crate 拿到的仍是纯标量实现）。
v2v-kernel = { path = "../kernel", features = ["unsafe-kernels"] }

[dev-dependencies]
# 只给 example / 集成测试用：从 ASF 里取视频样本做验证。
v2v-asf = { path = "../asf" }
# MP42 的对账样本只有 AVI 能装（ffmpeg 的 `msmpeg4v2` 编码器出 .avi）。
v2v-avi = { path = "../avi" }
# `tests/decode_bench.rs` 用它的 TSV 格式（`V2V_BENCH_TSV` 给了路径才写）。
v2v-bench = { path = "../bench" }
