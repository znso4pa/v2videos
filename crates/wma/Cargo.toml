[package]
name = "v2v-wma"
description = "纯 Rust 的 WMA（v1/v2）解码 —— 无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# IMDCT 的 FFT 与 Huffman 用的前缀码解码，都走共享内核（AGENTS.md 不变量 3：
# 谁都要用的东西不许复刻第二份）—— 与 aac 的 MDCT 是同一个函数。
v2v-kernel = { path = "../kernel" }

[dev-dependencies]
# 集成测试要拿真样本的音频载荷（经 ASF 解封装）。
v2v-asf = { path = "../asf" }
