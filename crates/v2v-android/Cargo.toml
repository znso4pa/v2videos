[package]
name = "v2v-android"
description = "Android 硬件编码路径（MediaCodec H.264 + MediaMuxer MP4）—— unsafe / FFI 集中在这里"
version.workspace = true
edition.workspace = true
license = "MIT"
build = "build.rs"
publish = false

# 只有 `rlib`：C ABI 已经搬到 `v2v-capi`（`hw` feature），这里不再产出 `.so`。
# 一个进程里同名 `#[no_mangle]` 只能有一份定义，两个库各导一份的话
# 要么链不起来，要么错误通道串到另一个库的线程局部变量上。
[lib]
crate-type = ["rlib"]

[dependencies]
v2v-player = { path = "../v2v-player" }
v2v-aac = { path = "../aac" }
v2v-mp4 = { path = "../v2v-mp4" }
v2v-asf = { path = "../v2v-asf" }
v2v-vc1 = { path = "../vc1" }
v2v-wma = { path = "../wma" }

[build-dependencies]
cc = "1"
