[package]
name = "v2v-vc1"
description = "纯 Rust 的 VC-1（WMV3）解码 —— Simple/Main profile、渐进、I/P 帧，无 C、无 FFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 位读取器 / 前缀码（VLC）/ 错误类型 / ABT 的 4:8 8:4 落位这几件「与具体编解码格式
# 无关」的东西，直接复用共享内核 —— 不复刻一遍（复刻出来的第二份才是真会跑偏的那份）。
v2v-kernel = { path = "../kernel" }
# `Planes` / `mid_pred` / `tables::SCAN` 目前还在 msmpeg4 里，等下一步搬进 kernel
# （见 TODO）。搬完这一行就能删。
v2v-msmpeg4 = { path = "../msmpeg4" }

[dev-dependencies]
# 只给集成测试用：从 ASF 里取视频样本 + extradata 做对账。
v2v-asf = { path = "../asf" }
v2v-container = { path = "../container" }
