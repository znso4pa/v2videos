name: CI

on:
  push:
    branches: [main]
  pull_request:

# 这里**故意不设**那些 `V2V_*` 样本变量：真样本一律不入库（版权 + 体积，见 AGENTS.md），
# 对账测试按设计去读环境变量、缺样本就打 `SKIP …` 并通过。
# 带真样本的整轨对账（逐帧对 ffmpeg / 逐 box 对 ffprobe）由人手工跑，那是发布前的动作。
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了也要看到另一个的结果 —— 两个平台失败的原因经常不一样。
      fail-fast: false
      matrix:
        include:
          # ⚠️ **只在 Linux 上装 ffmpeg**，两个理由：
          #
          # 1. **CI 的 runner 默认没有 ffmpeg**。少了它，那些「用合成帧、不需要真样本」
          #    的对账测试会整片 `SKIP` —— 那样的「绿」只证明「编译过了 + 不依赖工具的
          #    那部分过了」，证明力很弱。装上它，`mp4v` 的编→ffmpeg 解往返、
          #    `msmpeg4` 的 I/P 序列交叉验证才真的跑起来（这些**不需要样本**，
          #    所以 CI 跑得动）。
          # 2. macOS 那边走 `brew install ffmpeg` 要几分钟（依赖一大串），
          #    而 oracle 测试与平台无关 —— macOS 这个 job 的职责是**可移植性**
          #    （换链接器、换 std），不是重复验一遍 oracle。
          #
          # 所以两个 job 的分工是：**Linux 验语义，macOS 验可移植**。
          - os: ubuntu-latest
            ffmpeg: true
          - os: macos-latest
            ffmpeg: false
    steps:
      - uses: actions/checkout@v4

      # 许可证是**按 crate 分两种**的：六个含 FFmpeg 派生码表的 crate 是 LGPL-2.1+，
      # 其余是 MIT（见 NOTICE / README「许可证」）。
      #
      # 这条只能靠机器守：`license` 字段抄错一个字母、或者新增了一张生成表却没进
      # NOTICE，**编译、测试、clippy 全都不会有反应** —— 它只在法务意义上存在。
      - name: 许可证与 NOTICE 一致性
        run: python3 tools/check_license.py

      # 工具链由 `rust-toolchain.toml` 钉死，**不在这里另写版本** ——
      # 写两处就有两个真相。`rustup show` 会读到那个文件并把缺的装上。
      #
      # 为什么必须钉：AGENTS.md 的「零警告是硬要求」只有在版本固定时才是可满足的。
      # 用 @stable 的话，新版本多一条 lint 就红，而红的原因与本次改动无关 ——
      # 于是有人加 `#[allow]` 了事，「硬要求」就变成了摆设。
      - name: 工具链（按 rust-toolchain.toml）
        run: |
          rustup show
          rustc --version && cargo --version && cargo clippy --version

      - name: 装 ffmpeg（只 Linux）
        if: matrix.ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # ⚠️ `-j 4`：这里**故意**和本地（`-j 2`）不一样，别为了「一致」把 CI 也降到 2。
      #
      # runner 是 2 核，`-j 4` 让「等 I/O / 等链接」的那段时间有别的活可干；
      # 本地的 2 是给「一台机器上同时开着两个会话」留的余量（见 AGENTS.md「构建资源纪律」）。
      # 两个数字不一样，是因为它们防的东西不一样：CI 防的是**空转**，本地防的是**超载**。
      #
      # ⚠️ `RUSTFLAGS=-D warnings` + `--all-targets`：这就是把「零警告」从人的
      # 习惯变成机器约束的那一步。`--all-targets` 是必须的 —— 裸 `cargo build`
      # 不编 test / example，而警告最常出现在那里。依赖（`cc` 之类）不受影响：
      # cargo 对 registry 依赖自动加 `--cap-lints allow`，它们的警告封顶为 allow。
      - name: 构建（零警告是硬要求，这里由机器守）
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --workspace --all-targets -j 4

      # clippy 只把 **correctness / suspicious** 两组设为错误：那两组报的是
      # 「这段代码大概不是你想要的」，也就是真的可能出错的地方。
      # style / perf 现在还有两百多条，一次性清掉会掺进太多与行为无关的改动，
      # 而其中「浮点精度过剩」「运算无效果」那几条**可能改变数值** ——
      # 那种改动必须逐条验字节一致，不能批量做。见 TODO.md 的欠账一节。
      - name: clippy（correctness / suspicious 不许有）
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets -j 4 -- \
            -D clippy::correctness -D clippy::suspicious \
            -A clippy::style -A clippy::perf -A clippy::complexity

      # ⚠️ `--no-fail-fast`：默认一个测试目标挂了就**不再跑后面的**，
      # 于是「修一个、推一次、又发现下一个」要来回好几轮。实测过一次：
      # 默认跑法只暴露了 7 条失败，加了这个参数才看到还有另外 3 条。
      - name: 测试
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace -j 4 --no-fail-fast

      # `v2v bench` 的**接线**检查 —— 只确认子命令还挂在分派上、帮助打得出来。
      #
      # 这里**故意不量任何东西**：CI 没有真样本（版权 + 体积，不入库），而合成样本
      # 是 MP43、`v2v bench` 走 `v2v-player`（只认 WMV3）打不开。硬凑一个「跑通了」
      # 的假绿比不跑更坏。
      #
      # 性能门在本地：`v2v bench --check bench/baseline/<机器指纹>.tsv`，
      # 口径与「门卡比值不卡毫秒」的理由见 `bench/README.md`。
      # 格式 / 指纹 / 比较这三块是纯函数，由 `crates/v2v-bench` 的单元测试守着，
      # 上面那步 `cargo test --workspace` 已经跑了。
      - name: bench 子命令接线
        run: cargo run -q -p v2v-cli -- bench --help > /dev/null

# 不加 `cargo fmt`：仓里没有 `rustfmt.toml`，3 万行按默认风格重排会炸出一片
# 与本次改动无关的 diff。要加得先单独一轮把全仓格式化，那是另一件事。
